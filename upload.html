<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Firestore 成績批次匯入工具</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; line-height: 1.6; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 14px; margin-bottom: 1rem; }
    button { padding: 0.75rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #log { margin-top: 1rem; background: #f1f5f9; padding: 1rem; border-radius: 6px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h2>Firestore 成績與學生資料批次上傳</h2>
  <p>請將 Excel / GAS 轉換後的 JSON 格式成績資料貼在下方：</p>
  
  <textarea id="json-input" placeholder='[
  {
    "studentId": "112001",
    "name": "張小明",
    "email": "student01@school.edu",
    "examId": "2026_exam1",
    "examName": "第一次段考",
    "scores": {
      "chinese": { "score": 85, "level": "頂標" },
      "math": { "score": 92, "level": "頂標" }
    },
    "totalScore": 177,
    "classRank": 2
  }
]'></textarea>
  <br>
  <button id="upload-btn">開始批次寫入 Firestore</button>

  <div id="log">等待操作...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 請替換為您的 Firebase 設定
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const logDiv = document.getElementById('log');

    function log(msg) {
      logDiv.textContent += '\n' + msg;
    }

    document.getElementById('upload-btn').addEventListener('click', async () => {
      logDiv.textContent = "開始匯入作業...";
      try {
        const rawData = document.getElementById('json-input').value;
        const dataList = JSON.parse(rawData);

        const batch = writeBatch(db);

        dataList.forEach((item) => {
          // 1. 建立/更新學生資料
          const userRef = doc(db, "users", item.studentId);
          batch.set(userRef, {
            studentId: item.studentId,
            name: item.name,
            email: item.email
          }, { merge: true });

          // 2. 建立/更新考試成績資料
          const docId = `${item.studentId}_${item.examId}`;
          const examRef = doc(db, "exam_results", docId);
          batch.set(examRef, {
            studentId: item.studentId,
            examId: item.examId,
            examName: item.examName,
            scores: item.scores,
            totalScore: item.totalScore,
            classRank: item.classRank,
            updatedAt: new Date().toISOString()
          }, { merge: true });
        });

        await batch.commit();
        log("✅ 成功！所有成績與學生資料已批次寫入 Firestore。");
      } catch (err) {
        log("❌ 匯入失敗: " + err.message);
      }
    });
  </script>
</body>
</html>
