<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成員資料批次上傳</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #ffffff; padding: 24px; }
    h3 { font-size: 1.15rem; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
    .upload-card {
      border: 2px dashed #cbd5e1;
      padding: 40px;
      text-align: center;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    .upload-card:hover { border-color: var(--primary); }
  </style>
</head>
<body>
  <h3>成員資料批次上傳 (UploadUserData)</h3>
  <p class="subtitle">請上傳包含學生學號、姓名、座號等資訊的 Excel (.xlsx) 或 CSV 檔案，快速完成班級名單匯入。</p>

  <div class="upload-card" onclick="document.getElementById('file-input').click()">
    <p style="font-size: 1rem; font-weight: 500; margin-bottom: 6px;">📁 點擊或拖曳檔案至此上傳成員名單</p>
    <p style="font-size: 0.85rem; color: var(--text-muted);">支援格式：.csv, .xlsx</p>
    <input type="file" id="file-input" style="display: none;" accept=".csv, .xlsx">
  </div>

  <button type="button" class="btn btn-success" onclick="alert('已送出批次上傳解析')">⚡ 開始解析並匯入名單</button>
</body>
</html>
