<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成員資料批次上傳</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #ffffff; padding: 10px; }
    h3 { font-size: 1.15rem; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
    .upload-box {
      border: 2px dashed #cbd5e1;
      padding: 40px;
      text-align: center;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    .upload-box:hover { border-color: var(--primary); }
  </style>
</head>
<body>
  <h3>成員資料批次上傳</h3>
  <p class="subtitle">請上傳包含學生學號、姓名、座號等資訊的 Excel (.xlsx) 或 CSV 檔案，快速完成班級名單匯入。</p>

  <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <p style="font-size: 1rem; font-weight: 500; margin-bottom: 6px;">📁 點擊或拖曳檔案至此上傳成員名單</p>
    <p style="font-size: 0.85rem; color: var(--text-muted);">支援格式：.csv, .xlsx</p>
    <input type="file" id="file-input" style="display: none;" accept=".csv, .xlsx">
  </div>

  <button type="button" class="btn btn-success" id="upload-btn">⚡ 開始解析並寫入資料庫</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9wXfowaDCYxcn4lcxkkLybsFyCwra0ec",
      authDomain: "grade-system-a8953.firebaseapp.com",
      projectId: "grade-system-a8953",
      storageBucket: "grade-system-a8953.firebasestorage.app",
      messagingSenderId: "1009809233007",
      appId: "1:1009809233007:web:b739cd9e2326de1a83e99a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const classId = urlParams.get('class');

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--primary)';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = '#cbd5e1';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#cbd5e1';
      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        alert(`已選擇檔案：${fileInput.files[0].name}`);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        alert(`已選擇檔案：${fileInput.files[0].name}`);
      }
    });

    document.getElementById('upload-btn').addEventListener('click', async () => {
      if (!fileInput.files.length) {
        alert("請先選擇或拖曳要上傳的檔案！");
        return;
      }
      if (!classId) {
        alert("找不到班級代號！");
        return;
      }
      alert("正在上傳並同步至 Firebase 資料庫...");
      // 此處對應您的 Firebase 寫入邏輯
    });
  </script>
</body>
</html></html>
