<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>導師免費申請班級平台 - 系統管理</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-size: 1.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: var(--primary);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--success);
      width: auto;
      padding: 0.75rem 1.25rem;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background-color: #059669;
    }

    #result-card {
      display: none;
      margin-top: 2rem;
      padding: 1.5rem;
      background-color: #f1f5f9;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    #result-card h3 {
      margin-top: 0;
      color: var(--success);
      font-size: 1.15rem;
    }

    .url-box {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .url-box input {
      flex: 1;
      background-color: white;
    }

    .notice {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: #e2e8f0;
      padding: 0.75rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>導師班級平台申請</h2>
    <p class="subtitle">填寫基本資訊後，系統將自動建立專屬的班級管理空間並於畫面顯示連結。</p>

    <form id="apply-form">
      <div class="form-group">
        <label for="teacher-email">導師 Email 地址</label>
        <input type="email" id="teacher-email" placeholder="example@school.edu" required>
      </div>

      <div class="form-group">
        <label for="class-name">班級名稱</label>
        <input type="text" id="class-name" placeholder="例如：三年一班" required>
      </div>

      <button type="submit" id="submit-btn" class="btn">🚀 立即建立班級平台</button>
    </form>

    <!-- 建立成功後的結果顯示區塊 -->
    <div id="result-card">
      <h3>🎉 班級平台已成功建置！</h3>
      <p style="font-size: 0.9rem; margin: 0;">請複製下方您的專屬班級管理網址：</p>
      
      <div class="url-box">
        <input type="text" id="class-url" readonly>
        <button type="button" id="copy-btn" class="btn btn-secondary">📋 複製連結</button>
      </div>

      <div class="notice">
        💡 <strong>提示：</strong>請妥善保存此專屬連結，點擊連結即可進入 `UploadUserData.html` 開始下載範例 CSV 及匯入學生/家長帳號。
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 配置設定
    const firebaseConfig = {
      apiKey: "AIzaSyD9wXfowaDCYxcn4lcxkkLybsFyCwra0ec",
      authDomain: "grade-system-a8953.firebaseapp.com",
      projectId: "grade-system-a8953",
      storageBucket: "grade-system-a8953.firebasestorage.app",
      messagingSenderId: "1009809233007",
      appId: "1:1009809233007:web:b739cd9e2326de1a83e99a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('apply-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = "建立中，請稍候...";

      const email = document.getElementById('teacher-email').value.trim();
      const className = document.getElementById('class-name').value.trim();

      // 隨機產生 6 位數獨立班級 ID (例如: c_k3x8a1)
      const classId = "c_" + Math.random().toString(36).substring(2, 8);

      try {
        // 1. 寫入 Firestore 班級紀錄
        await setDoc(doc(db, "classes", classId), {
          className: className,
          teacherEmail: email,
          createdAt: new Date().toISOString()
        });

        // 2. 組合專屬的成員帳號上傳連結 (UploadUserData.html)
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const targetUrl = `${baseUrl}/UploadUserData.html?class=${classId}`;

        // 3. 畫面顯示結果與專屬 URL
        document.getElementById('class-url').value = targetUrl;
        document.getElementById('result-card').style.display = 'block';

      } catch (err) {
        alert("建立失敗：" + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "🚀 立即建立班級平台";
      }
    });

    // 複製連結按鈕處理
    document.getElementById('copy-btn').addEventListener('click', () => {
      const urlInput = document.getElementById('class-url');
      urlInput.select();
      document.execCommand('copy');
      alert("已成功複製班級專屬連結！");
    });
  </script>
</body>
</html>
