<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>導師免費申請班級平台 - 系統管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card" style="max-width: 600px; margin: 2rem auto;">
    <h2>導師班級平台申請</h2>
    <p class="subtitle">填寫基本資訊後，系統將自動建立專屬的班級管理空間。</p>

    <form id="apply-form">
      <div class="form-group">
        <label for="teacher-email">導師 Email 地址</label>
        <input type="email" id="teacher-email" placeholder="example@school.edu" required>
      </div>

      <div class="form-group">
        <label for="class-name">班級名稱</label>
        <input type="text" id="class-name" placeholder="例如：三年一班" required>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-full">🚀 立即建立班級平台</button>
    </form>

    <div id="result-card" style="display: none; margin-top: 2rem;">
      <h3 style="color: var(--success); margin-top:0;">🎉 班級平台已成功建置！</h3>
      <p style="font-size: 0.9rem; margin: 0;">請複製下方您的專屬**導師後台後台網址**：</p>
      
      <div class="url-box">
        <input type="text" id="class-url" readonly>
        <button type="button" id="copy-btn" class="btn btn-success" style="white-space: nowrap;">📋 複製後台連結</button>
      </div>

      <div class="notice">
        💡 <strong>提示：</strong>進入後台後，您可以取得學生/家長登入連結，並進行帳號與成績的批次上傳。
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9wXfowaDCYxcn4lcxkkLybsFyCwra0ec",
      authDomain: "grade-system-a8953.firebaseapp.com",
      projectId: "grade-system-a8953",
      storageBucket: "grade-system-a8953.firebasestorage.app",
      messagingSenderId: "1009809233007",
      appId: "1:1009809233007:web:b739cd9e2326de1a83e99a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('apply-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = "建立中，請稍候...";

      const email = document.getElementById('teacher-email').value.trim();
      const className = document.getElementById('class-name').value.trim();
      const classId = "c_" + Math.random().toString(36).substring(2, 8);

      try {
        await setDoc(doc(db, "classes", classId), {
          className: className,
          teacherEmail: email,
          createdAt: new Date().toISOString()
        });

        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const targetUrl = `${baseUrl}/teacher_dashboard.html?class=${classId}`;

        document.getElementById('class-url').value = targetUrl;
        document.getElementById('result-card').style.display = 'block';

      } catch (err) {
        alert("建立失敗：" + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "🚀 立即建立班級平台";
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const urlInput = document.getElementById('class-url');
      urlInput.select();
      document.execCommand('copy');
      alert("已成功複製導師後台連結！");
    });
  </script>
</body>
</html>
