<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級成績與成員管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (Excel 解析) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- 頁頭 -->
    <header class="mb-8 border-b border-slate-800 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-100 flex items-center gap-3">
          <i class="fa-solid fa-graduation-cap text-amber-400"></i>
          班級成績與成員管理系統
        </h1>
        <p class="text-xs text-slate-400 mt-1">整合 Excel 上傳、使用者帳號編修、成績閱覽與單筆成績維護功能</p>
      </div>
    </header>

    <!-- 管理主區塊 -->
    <section id="page-admin" class="space-y-6">
      
      <!-- 功能頁籤 (Tabs) -->
      <div class="flex border-b border-slate-800 space-x-2 overflow-x-auto">
        <button id="tabBtn-upload" onclick="adminApp.switchTab('upload')" class="px-4 py-2.5 text-xs font-medium rounded-t-lg transition-colors flex items-center gap-2 border-b-2 border-slate-200 text-slate-100 bg-slate-800/50">
          <i class="fa-solid fa-file-excel text-emerald-400"></i> Excel 匯入成績
        </button>
        <button id="tabBtn-edit" onclick="adminApp.switchTab('edit')" class="px-4 py-2.5 text-xs font-medium rounded-t-lg transition-colors flex items-center gap-2 text-slate-400 hover:text-slate-200 border-b-2 border-transparent">
          <i class="fa-solid fa-users-gear text-blue-400"></i> 使用者名單編修
        </button>
        <button id="tabBtn-grades" onclick="adminApp.switchTab('grades')" class="px-4 py-2.5 text-xs font-medium rounded-t-lg transition-colors flex items-center gap-2 text-slate-400 hover:text-slate-200 border-b-2 border-transparent">
          <i class="fa-solid fa-chart-simple text-purple-400"></i> 班級成績總覽
        </button>
        <button id="tabBtn-gradeEdit" onclick="adminApp.switchTab('gradeEdit')" class="px-4 py-2.5 text-xs font-medium rounded-t-lg transition-colors flex items-center gap-2 text-slate-400 hover:text-slate-200 border-b-2 border-transparent">
          <i class="fa-solid fa-pen-to-square text-amber-400"></i> 成績單筆編修
        </button>
      </div>

      <!-- 功能一：Excel 匯入成績頁籤 -->
      <div id="adminTab-upload" class="admin-tab-content space-y-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
          <h3 class="text-sm font-semibold text-slate-200">批量上傳 Excel 成績檔</h3>
          <div class="flex flex-col md:flex-row items-center gap-4">
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
            <button onclick="adminApp.handleFileUpload()" class="w-full md:w-auto text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded transition-colors whitespace-nowrap">
              解析 Excel 檔案
            </button>
          </div>
          <div id="uploadStatus" class="text-xs text-slate-400"></div>
        </div>
      </div>

      <!-- 功能二：使用者名單編修頁籤 -->
      <div id="adminTab-edit" class="admin-tab-content hidden space-y-4">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
          <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">班級成員維護</h3>
          <div class="flex items-center gap-2">
            <button onclick="adminApp.openUserModal()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded transition-colors flex items-center gap-1 shadow">
              <i class="fa-solid fa-user-plus"></i> 新增成員
            </button>
            <button onclick="adminApp.loadCurrentClassUsers()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded transition-colors flex items-center gap-1">
              <i class="fa-solid fa-rotate-right"></i> 重新整理
            </button>
          </div>
        </div>

        <div class="border border-slate-800 rounded-lg overflow-hidden bg-slate-900/50">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-800/60 text-slate-400 uppercase font-mono border-b border-slate-800">
              <tr>
                <th class="px-4 py-3">帳號 / 學號</th>
                <th class="px-4 py-3">姓名</th>
                <th class="px-4 py-3">角色</th>
                <th class="px-4 py-3 text-center">操作區</th>
              </tr>
            </thead>
            <tbody id="classUsersTable" class="divide-y divide-slate-800 font-mono">
              <tr><td colspan="4" class="px-4 py-6 text-center text-slate-500">載入成員資料中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 功能三：班級成績總覽頁籤 -->
      <div id="adminTab-grades" class="admin-tab-content hidden space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">現有成績數據紀錄</h3>
          <span id="totalGradeCount" class="text-xs font-mono text-slate-400 bg-slate-800 px-2 py-1 rounded">0 筆</span>
        </div>
        <div class="p-4 bg-slate-900/40 border border-slate-800 rounded-lg text-xs text-slate-400">
          點擊下方「成績單筆編修」分頁可進行更詳細的動態篩選、排序與個案修改。
        </div>
      </div>

      <!-- 功能四：成績單筆編修頁籤 -->
      <div id="adminTab-gradeEdit" class="admin-tab-content hidden space-y-4">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
          <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">本班成績單筆管理與編修</h3>
          
          <div class="flex items-center gap-2">
            <button onclick="adminApp.openGradeModal()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-3 py-1.5 rounded transition-colors flex items-center gap-1 shadow">
              <i class="fa-solid fa-plus"></i> 單筆新增成績
            </button>
            <button onclick="adminApp.loadExistingGrades()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded transition-colors flex items-center gap-1">
              <i class="fa-solid fa-rotate-right"></i> 重新整理
            </button>
          </div>
        </div>

        <!-- 搜尋、篩選與排序控制列 -->
        <div class="bg-slate-800/40 border border-slate-800 rounded-lg p-3 grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
          <!-- 搜尋關鍵字 -->
          <div class="md:col-span-3 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
            <input type="text" id="gradeSearchInput" oninput="adminApp.applyGradeFilterAndSort()" placeholder="搜尋學號、姓名或單元..." class="w-full bg-slate-900 border border-slate-700 rounded pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-slate-500">
          </div>

          <!-- 科目篩選 -->
          <div class="md:col-span-3 flex items-center gap-2">
            <span class="text-xs text-slate-400 whitespace-nowrap">科目:</span>
            <select id="gradeSubjectFilter" onchange="adminApp.applyGradeFilterAndSort()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-slate-500">
              <option value="all">全部科目</option>
            </select>
          </div>

          <!-- 分項篩選 -->
          <div class="md:col-span-3 flex items-center gap-2">
            <span class="text-xs text-slate-400 whitespace-nowrap">分項:</span>
            <select id="gradeCategoryFilter" onchange="adminApp.applyGradeFilterAndSort()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-slate-500">
              <option value="all">全部分項</option>
            </select>
          </div>

          <!-- 排序選單 -->
          <div class="md:col-span-3 flex items-center gap-2">
            <span class="text-xs text-slate-400 whitespace-nowrap">排序:</span>
            <select id="gradeSortField" onchange="adminApp.applyGradeFilterAndSort()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-slate-500">
              <option value="studentId_asc">學號 (升冪)</option>
              <option value="score_desc">分數 (由高到低)</option>
              <option value="score_asc">分數 (由低到高)</option>
              <option value="date_desc">日期 (由新到舊)</option>
            </select>
          </div>
        </div>

        <!-- 成績清單表格 -->
        <div class="border border-slate-800 rounded-lg overflow-hidden bg-slate-900/50 overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300 min-w-[850px]">
            <thead class="bg-slate-800/60 text-slate-400 uppercase font-mono border-b border-slate-800">
              <tr>
                <th class="px-3 py-3">學號</th>
                <th class="px-3 py-3">姓名</th>
                <th class="px-3 py-3">科目</th>
                <th class="px-3 py-3">日期</th>
                <th class="px-3 py-3">分項</th>
                <th class="px-3 py-3">單元</th>
                <th class="px-3 py-3">分數 / 標記</th>
                <th class="px-3 py-3 text-center">操作區</th>
              </tr>
            </thead>
            <tbody id="classGradesTable" class="divide-y divide-slate-800 font-mono">
              <tr>
                <td colspan="8" class="px-4 py-6 text-center text-slate-500">載入成績資料中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </div>

  <!-- 單筆新增 / 編輯使用者 Modal -->
  <div id="userModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-lg max-w-sm w-full p-6 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="userModalTitle" class="text-base font-semibold text-slate-100">新增成員</h3>
        <button onclick="adminApp.closeUserModal()" class="text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="userForm" onsubmit="adminApp.handleSaveUser(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editUsernameOriginal">
        <div>
          <label class="block font-medium text-slate-400 mb-1">帳號 / 學號 *</label>
          <input type="text" id="modalUsername" required class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
        </div>
        <div>
          <label class="block font-medium text-slate-400 mb-1">姓名 *</label>
          <input type="text" id="modalName" required class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
        </div>
        <div>
          <label class="block font-medium text-slate-400 mb-1">角色 *</label>
          <select id="modalRole" required class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
            <option value="student">學生 (student)</option>
            <option value="teacher">教師 (teacher)</option>
          </select>
        </div>
        <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">
          <button type="button" onclick="adminApp.closeUserModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded transition-colors">取消</button>
          <button type="submit" id="saveUserBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-1.5 rounded transition-colors">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 單筆新增 / 編輯成績 Modal 視窗 -->
  <div id="gradeModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-lg max-w-md w-full p-6 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="gradeModalTitle" class="text-base font-semibold text-slate-100">新增成績紀錄</h3>
        <button onclick="adminApp.closeGradeModal()" class="text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="gradeForm" onsubmit="adminApp.handleSaveGrade(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editGradeDocId">

        <div>
          <label class="block font-medium text-slate-400 mb-1">選擇學生 (學號) *</label>
          <select id="modalGradeStudentId" required class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
            <option value="">-- 請選擇學生 --</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-400 mb-1">科目 *</label>
            <input type="text" id="modalGradeSubject" required placeholder="例如: 歷史" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
          </div>
          <div>
            <label class="block font-medium text-slate-400 mb-1">日期 *</label>
            <input type="date" id="modalGradeDate" required class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-400 mb-1">分項 (類別) *</label>
            <input type="text" id="modalGradeCategory" required placeholder="例如: 小考 / 習作" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
          </div>
          <div>
            <label class="block font-medium text-slate-400 mb-1">單元 / 範圍</label>
            <input type="text" id="modalGradeUnit" placeholder="例如: C1" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-400 mb-1">分數 / 訂正標記 *</label>
          <input type="text" id="modalGradeValue" required placeholder="例如: 85 或 V" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500">
        </div>

        <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">
          <button type="button" onclick="adminApp.closeGradeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded transition-colors">取消</button>
          <button type="submit" id="saveGradeBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-1.5 rounded transition-colors">儲存成績資料</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase 模組與主程式邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 配置 (請更換為您的 Firebase 專案設定)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 模擬測試用 session，實際環境可依系統登入設定
    if (!sessionStorage.getItem('currentUser')) {
      sessionStorage.setItem('currentUser', JSON.stringify({
        username: 'admin',
        classHash: 'CLASS_DEMO_HASH',
        role: 'teacher'
      }));
    }

    const adminApp = {
      activeTab: 'upload',
      rawClassUsers: [],
      rawGradesList: [],
      filteredGrades: [],
      existingGradesMap: new Map(),

      init() {
        this.loadCurrentClassUsers();
        this.loadExistingGrades();
      },

      switchTab(tabName) {
        this.activeTab = tabName;
        document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
        
        const btnUpload = document.getElementById('tabBtn-upload');
        const btnEdit = document.getElementById('tabBtn-edit');
        const btnGrades = document.getElementById('tabBtn-grades');
        const btnGradeEdit = document.getElementById('tabBtn-gradeEdit');

        const baseClass = "px-4 py-2.5 text-xs font-medium rounded-t-lg transition-colors flex items-center gap-2 text-slate-400 hover:text-slate-200 border-b-2 border-transparent";
        const activeClass = "px-4 py-2.5 text-xs font-medium rounded-t-lg transition-colors flex items-center gap-2 border-b-2 border-slate-200 text-slate-100 bg-slate-800/50";

        if (btnUpload) btnUpload.className = baseClass;
        if (btnEdit) btnEdit.className = baseClass;
        if (btnGrades) btnGrades.className = baseClass;
        if (btnGradeEdit) btnGradeEdit.className = baseClass;

        if (tabName === 'upload') {
          document.getElementById('adminTab-upload').classList.remove('hidden');
          btnUpload.className = activeClass;
        } else if (tabName === 'edit') {
          document.getElementById('adminTab-edit').classList.remove('hidden');
          btnEdit.className = activeClass;
          this.loadCurrentClassUsers();
        } else if (tabName === 'grades') {
          document.getElementById('adminTab-grades').classList.remove('hidden');
          btnGrades.className = activeClass;
          this.loadCurrentClassUsers();
          this.loadExistingGrades();
        } else if (tabName === 'gradeEdit') {
          document.getElementById('adminTab-gradeEdit').classList.remove('hidden');
          btnGradeEdit.className = activeClass;
          this.loadCurrentClassUsers();
          this.loadExistingGrades();
        }
      },

      // 載入成員名單
      async loadCurrentClassUsers() {
        const sessionUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
        const classHash = sessionUser.classHash;
        if (!classHash) return;

        try {
          const q = query(collection(db, "users"), where("classHash", "==", classHash));
          const querySnapshot = await getDocs(q);

          this.rawClassUsers = [];
          querySnapshot.forEach(docSnap => {
            this.rawClassUsers.push({ docId: docSnap.id, ...docSnap.data() });
          });

          this.renderClassUsersTable();
        } catch (err) {
          console.error("Load class users error:", err);
        }
      },

      renderClassUsersTable() {
        const tbody = document.getElementById('classUsersTable');
        if (!tbody) return;

        if (this.rawClassUsers.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-500">目前尚無班級成員資料</td></tr>`;
          return;
        }

        let html = '';
        this.rawClassUsers.forEach(u => {
          const uname = u.username || u.studentId;
          html += `
            <tr class="hover:bg-slate-800/40 transition-colors">
              <td class="px-4 py-2.5 text-slate-200 font-medium">${uname}</td>
              <td class="px-4 py-2.5 text-slate-300">${u.name || '--'}</td>
              <td class="px-4 py-2.5 text-slate-400">
                <span class="px-2 py-0.5 text-[10px] rounded ${u.role === 'teacher' ? 'bg-purple-900/50 text-purple-300' : 'bg-slate-800 text-slate-300'}">${u.role || 'student'}</span>
              </td>
              <td class="px-4 py-2.5 text-center">
                <div class="flex items-center justify-center space-x-2">
                  <button onclick="adminApp.openUserModal('${uname}')" title="編輯成員" class="p-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition-colors">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button onclick="adminApp.deleteUser('${uname}')" title="刪除成員" class="p-1 bg-slate-800 hover:bg-red-900/60 text-red-400 rounded border border-slate-700 transition-colors">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      },

      openUserModal(username = null) {
        const modal = document.getElementById('userModal');
        const modalTitle = document.getElementById('userModalTitle');
        const editUsernameOriginal = document.getElementById('editUsernameOriginal');

        if (username) {
          const user = this.rawClassUsers.find(u => (u.username || u.studentId) === username);
          if (!user) return;
          modalTitle.innerText = "編輯成員資料";
          editUsernameOriginal.value = username;
          document.getElementById('modalUsername').value = username;
          document.getElementById('modalName').value = user.name || '';
          document.getElementById('modalRole').value = user.role || 'student';
        } else {
          modalTitle.innerText = "新增成員";
          editUsernameOriginal.value = "";
          document.getElementById('userForm').reset();
        }
        modal.classList.remove('hidden');
      },

      closeUserModal() {
        document.getElementById('userModal').classList.add('hidden');
      },

      async handleSaveUser(e) {
        e.preventDefault();
        const sessionUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
        const classHash = sessionUser.classHash;

        const username = document.getElementById('modalUsername').value.trim();
        const name = document.getElementById('modalName').value.trim();
        const role = document.getElementById('modalRole').value;
        const originalUsername = document.getElementById('editUsernameOriginal').value;

        if (!username || !name) return;

        try {
          if (originalUsername && originalUsername !== username) {
            await deleteDoc(doc(db, "users", originalUsername));
          }

          await setDoc(doc(db, "users", username), {
            username, studentId: username, name, role, classHash,
            updatedAt: new Date().toISOString()
          }, { merge: true });

          alert("成員資料已順利儲存！");
          this.closeUserModal();
          this.loadCurrentClassUsers();
        } catch (err) {
          console.error("Save user error:", err);
          alert(`儲存失敗: ${err.message}`);
        }
      },

      async deleteUser(username) {
        if (!confirm(`確定要刪除成員 ${username} 嗎？`)) return;
        try {
          await deleteDoc(doc(db, "users", username));
          alert("成員已順利刪除！");
          this.loadCurrentClassUsers();
        } catch (err) {
          console.error("Delete user error:", err);
          alert(`刪除失敗: ${err.message}`);
        }
      },

      // 載入成績列表
      async loadExistingGrades() {
        const sessionUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
        const classHash = sessionUser.classHash;
        if (!classHash) return;

        try {
          const q = query(collection(db, "grades"), where("classHash", "==", classHash));
          const querySnapshot = await getDocs(q);

          this.existingGradesMap.clear();
          this.rawGradesList = [];
          let count = 0;

          querySnapshot.forEach(docSnap => {
            const g = docSnap.data();
            const key = `${g.studentId}_${g.subject}_${g.date}_${g.category}_${g.unit}`;
            const record = { docId: docSnap.id, ...g };
            
            this.existingGradesMap.set(key, record);
            this.rawGradesList.push(record);
            count++;
          });

          const countEl = document.getElementById('totalGradeCount');
          if (countEl) countEl.innerText = `${count} 筆`;

          this.populateGradeFilters();
          this.applyGradeFilterAndSort();

        } catch (err) {
          console.error("Load existing grades failed:", err);
        }
      },

      // 動態填入篩選清單
      populateGradeFilters() {
        const subjSelect = document.getElementById('gradeSubjectFilter');
        const catSelect = document.getElementById('gradeCategoryFilter');
        if (!subjSelect || !catSelect) return;

        const subjects = new Set();
        const categories = new Set();

        this.rawGradesList.forEach(g => {
          if (g.subject) subjects.add(g.subject);
          if (g.category) categories.add(g.category);
        });

        subjSelect.innerHTML = '<option value="all">全部科目</option>' + 
          Array.from(subjects).map(s => `<option value="${s}">${s}</option>`).join('');
          
        catSelect.innerHTML = '<option value="all">全部分項</option>' + 
          Array.from(categories).map(c => `<option value="${c}">${c}</option>`).join('');
      },

      // 篩選與排序邏輯
      applyGradeFilterAndSort() {
        const searchInput = document.getElementById('gradeSearchInput');
        if (!searchInput) return;

        const search = searchInput.value.trim().toLowerCase();
        const subjFilter = document.getElementById('gradeSubjectFilter').value;
        const catFilter = document.getElementById('gradeCategoryFilter').value;
        const sortField = document.getElementById('gradeSortField').value;

        this.filteredGrades = this.rawGradesList.filter(g => {
          const user = this.rawClassUsers.find(u => u.studentId === g.studentId || u.username === g.studentId);
          const studentName = user ? user.name : '';

          const matchSearch = !search || 
            g.studentId.toLowerCase().includes(search) ||
            studentName.toLowerCase().includes(search) ||
            (g.unit && g.unit.toLowerCase().includes(search));

          const matchSubj = subjFilter === 'all' || g.subject === subjFilter;
          const matchCat = catFilter === 'all' || g.category === catFilter;

          return matchSearch && matchSubj && matchCat;
        });

        this.filteredGrades.sort((a, b) => {
          const valA = parseFloat(a.value) || 0;
          const valB = parseFloat(b.value) || 0;

          if (sortField === 'score_desc') return valB - valA;
          if (sortField === 'score_asc') return valA - valB;
          if (sortField === 'date_desc') return (b.date || '').localeCompare(a.date || '');
          if (sortField === 'studentId_asc') return (a.studentId || '').localeCompare(b.studentId || '');
          return 0;
        });

        this.renderClassGradesTable();
      },

      // 渲染單筆編修成績表格
      renderClassGradesTable() {
        const tbody = document.getElementById('classGradesTable');
        if (!tbody) return;

        if (this.filteredGrades.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="px-4 py-6 text-center text-slate-500">查無符合條件的成績紀錄</td></tr>`;
          return;
        }

        let html = '';
        this.filteredGrades.forEach(g => {
          const user = this.rawClassUsers.find(u => u.studentId === g.studentId || u.username === g.studentId);
          const studentName = user ? user.name : '--';

          html += `
            <tr class="hover:bg-slate-800/40 transition-colors">
              <td class="px-3 py-2.5 text-slate-300">${g.studentId}</td>
              <td class="px-3 py-2.5 text-slate-200 font-medium">${studentName}</td>
              <td class="px-3 py-2.5 text-amber-300 font-semibold">${g.subject}</td>
              <td class="px-3 py-2.5 text-slate-400">${g.date || '--'}</td>
              <td class="px-3 py-2.5 text-slate-300">${g.category || '--'}</td>
              <td class="px-3 py-2.5 text-slate-400">${g.unit || '--'}</td>
              <td class="px-3 py-2.5 text-slate-100 font-bold">${g.value}</td>
              <td class="px-3 py-2.5 text-center">
                <div class="flex items-center justify-center space-x-1.5">
                  <button onclick="adminApp.openGradeModal('${g.docId}')" title="編輯成績" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition-colors">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button onclick="adminApp.deleteGrade('${g.docId}')" title="刪除成績" class="p-1.5 bg-slate-800 hover:bg-red-900/60 text-red-400 rounded border border-slate-700 transition-colors">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      },

      // 開啟單筆成績 Modal
      openGradeModal(docId = null) {
        const modal = document.getElementById('gradeModal');
        const modalTitle = document.getElementById('gradeModalTitle');
        const studentSelect = document.getElementById('modalGradeStudentId');
        const editDocIdInput = document.getElementById('editGradeDocId');

        const students = this.rawClassUsers.filter(u => u.role === 'student');
        studentSelect.innerHTML = '<option value="">-- 請選擇學生 --</option>' + 
          students.map(s => `<option value="${s.studentId || s.username}">${s.name} (${s.studentId || s.username})</option>`).join('');

        if (docId) {
          const record = this.rawGradesList.find(g => g.docId === docId);
          if (!record) return;

          modalTitle.innerText = "編輯成績紀錄";
          editDocIdInput.value = docId;

          studentSelect.value = record.studentId;
          document.getElementById('modalGradeSubject').value = record.subject;
          document.getElementById('modalGradeDate').value = record.date;
          document.getElementById('modalGradeCategory').value = record.category;
          document.getElementById('modalGradeUnit').value = record.unit || '';
          document.getElementById('modalGradeValue').value = record.value;
        } else {
          modalTitle.innerText = "新增成績紀錄";
          editDocIdInput.value = "";
          document.getElementById('gradeForm').reset();
          document.getElementById('modalGradeDate').valueAsDate = new Date();
        }

        modal.classList.remove('hidden');
      },

      closeGradeModal() {
        document.getElementById('gradeModal').classList.add('hidden');
      },

      // 儲存單筆成績
      async handleSaveGrade(e) {
        e.preventDefault();
        const sessionUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
        const classHash = sessionUser.classHash;

        if (!classHash) {
          alert("無法讀取班級 Hash，請重新登入！");
          return;
        }

        const studentId = document.getElementById('modalGradeStudentId').value;
        const subject = document.getElementById('modalGradeSubject').value.trim();
        const date = document.getElementById('modalGradeDate').value;
        const category = document.getElementById('modalGradeCategory').value.trim();
        const unit = document.getElementById('modalGradeUnit').value.trim() || '全';
        const value = document.getElementById('modalGradeValue').value.trim();
        const originalDocId = document.getElementById('editGradeDocId').value;

        const newDocId = `${classHash}_${studentId}_${subject}_${date}_${category}_${unit}`.replace(/[\/\s]/g, '_');

        const gradeData = {
          classHash, studentId, subject, date, category, unit, value,
          updatedAt: new Date().toISOString()
        };

        const btn = document.getElementById('saveGradeBtn');
        try {
          btn.disabled = true;
          btn.innerText = "儲存中...";

          if (originalDocId && originalDocId !== newDocId) {
            await deleteDoc(doc(db, "grades", originalDocId));
          }

          await setDoc(doc(db, "grades", newDocId), gradeData, { merge: true });

          alert("成績已成功儲存！");
          this.closeGradeModal();
          this.loadExistingGrades();
        } catch (err) {
          console.error("Save grade error:", err);
          alert(`儲存失敗: ${err.message}`);
        } finally {
          btn.disabled = false;
          btn.innerText = "儲存成績資料";
        }
      },

      // 刪除單筆成績
      async deleteGrade(docId) {
        if (!confirm("確定要刪除此筆成績紀錄嗎？此操作無法復原！")) return;

        try {
          await deleteDoc(doc(db, "grades", docId));
          alert("成績紀錄已成功刪除！");
          this.loadExistingGrades();
        } catch (err) {
          console.error("Delete grade error:", err);
          alert(`刪除失敗: ${err.message}`);
        }
      },

      // Excel 上傳與處理簡易範例
      handleFileUpload() {
        const fileInput = document.getElementById('excelFileInput');
        const statusEl = document.getElementById('uploadStatus');
        if (!fileInput.files.length) {
          alert("請選擇 Excel 檔案！");
          return;
        }
        statusEl.innerText = "檔案讀取中...";
        // 相關 SheetJS 檔案解析與寫入邏輯可在此擴充
      }
    };

    window.adminApp = adminApp;
    adminApp.init();
  </script>
</body>
</html>
