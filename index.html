<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級成績管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- SheetJS (XLSX 解析套件) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f4f6f8',
              100: '#e5e9f0',
              500: '#475569',
              600: '#334155',
              700: '#1e293b',
              800: '#0f172a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-brand-700 text-white rounded-lg">
          <i class="fa-solid fa-graduation-cap text-xl"></i>
        </div>
        <h1 class="text-xl font-bold text-brand-800 tracking-tight">班級成績管理系統</h1>
      </div>
      <div class="text-sm text-slate-500">
        <i class="fa-regular fa-file-excel mr-1 text-emerald-600"></i>僅支援 Excel (.xlsx / .xls)
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- Upload Area -->
    <section class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm transition-all">
      <div class="max-w-xl mx-auto text-center">
        <div class="w-16 h-16 bg-brand-100 text-brand-700 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
          <i class="fa-solid fa-file-arrow-up"></i>
        </div>
        <h2 class="text-lg font-semibold text-brand-800 mb-1">上傳學生名冊與成績冊</h2>
        <p class="text-sm text-slate-500 mb-6">請選擇或拖曳 Excel 檔案至下方區塊（不支援 CSV 格式）</p>

        <!-- Drag & Drop Container -->
        <label for="fileInput" 
               id="dropZone" 
               class="border-2 border-dashed border-slate-300 hover:border-brand-500 hover:bg-slate-50 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition">
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-2"></i>
          <span class="text-sm font-medium text-slate-700">點擊選擇檔案 或 將 Excel 檔案拖曳至此</span>
          <span class="text-xs text-slate-400 mt-1">支援副檔名：.xlsx, .xls</span>
          
          <!-- File Input: 只接收 .xlsx 和 .xls -->
          <input type="file" 
                 id="fileInput" 
                 accept=".xlsx, .xls" 
                 class="hidden" 
                 onchange="handleFileUpload(event)">
        </label>
      </div>
    </section>

    <!-- Stats Dashboard (預設隱藏) -->
    <section id="statsSection" class="hidden grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">總人數</p>
          <p id="statCount" class="text-2xl font-bold text-brand-800 mt-1">0</p>
        </div>
        <div class="p-3 bg-slate-100 text-slate-600 rounded-lg"><i class="fa-solid fa-users text-lg"></i></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">平均分數</p>
          <p id="statAvg" class="text-2xl font-bold text-brand-800 mt-1">0</p>
        </div>
        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i class="fa-solid fa-calculator text-lg"></i></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">最高分</p>
          <p id="statMax" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
        </div>
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><i class="fa-solid fa-trophy text-lg"></i></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">最低分</p>
          <p id="statMin" class="text-2xl font-bold text-rose-600 mt-1">0</p>
        </div>
        <div class="p-3 bg-rose-50 text-rose-600 rounded-lg"><i class="fa-solid fa-circle-exclamation text-lg"></i></div>
      </div>
    </section>

    <!-- Data Preview Table (預設隱藏) -->
    <section id="previewSection" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-semibold text-brand-800 flex items-center gap-2">
          <i class="fa-solid fa-table text-slate-500"></i> 成績預覽表
        </h3>
        <span id="fileNameBadge" class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full font-medium"></span>
      </div>
      <div class="overflow-x-auto max-h-[500px]">
        <table class="w-full text-sm text-left text-slate-600">
          <thead id="tableHead" class="bg-slate-50 text-xs text-slate-700 uppercase sticky top-0 border-b border-slate-200">
            <!-- 動態生成表頭 -->
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <!-- 動態生成表身 -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Script logic -->
  <script>
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      
      // 嚴格阻擋 CSV 檔案與驗證 Excel 副檔名
      const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');
      if (!isExcel) {
        alert("系統已停止支援 CSV 格式上傳，請上傳 .xlsx 或 .xls 格式的 Excel 檔案！");
        event.target.value = ''; // 清空 input 檔案選擇
        return;
      }

      const reader = new FileReader();
      reader.readAsArrayBuffer(file);

      reader.onload = function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          // 讀取 Excel 內容
          const workbook = XLSX.read(data, { type: 'array' });

          // 取得第一個 Sheet
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];

          // 轉換成 JSON 二維陣列格式
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (jsonData.length === 0) {
            alert("上傳的 Excel 檔案為空檔！");
            return;
          }

          renderPreviewTable(jsonData, file.name);
          calculateStats(jsonData);

        } catch (error) {
          console.error("解析 Excel 檔案失敗：", error);
          alert("讀取檔案失敗，請確保這是有效的 Excel 檔案。");
        }
      };
    }

    // 渲染預覽表格
    function renderPreviewTable(data, fileName) {
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');
      const fileNameBadge = document.getElementById('fileNameBadge');

      thead.innerHTML = '';
      tbody.innerHTML = '';

      if (data.length === 0) return;

      // 第一行作為表頭
      const headers = data[0];
      let trHead = '<tr class="bg-slate-100 text-slate-700 font-bold">';
      headers.forEach(header => {
        trHead += `<th class="px-6 py-3 border-b border-slate-200">${header || ''}</th>`;
      });
      trHead += '</tr>';
      thead.innerHTML = trHead;

      // 後續資料作為內容
      for (let i = 1; i < data.length; i++) {
        const row = data[i];
        if (row.length === 0) continue; // 忽略空行

        let trBody = '<tr class="hover:bg-slate-50 transition">';
        for (let j = 0; j < headers.length; j++) {
          trBody += `<px-6 class="px-6 py-3.5 border-b border-slate-100 whitespace-nowrap">${row[j] !== undefined ? row[j] : ''}</px-6>`;
        }
        trBody += '</tr>';
        tbody.insertAdjacentHTML('beforeend', trBody);
      }

      fileNameBadge.textContent = fileName;
      document.getElementById('previewSection').classList.remove('hidden');
    }

    // 計算基礎數據（自動識別數值欄位）
    function calculateStats(data) {
      if (data.length <= 1) return;

      const rows = data.slice(1);
      let totalStudents = rows.length;
      let scores = [];

      // 嘗試抓取每一行的數字資料進行統計
      rows.forEach(row => {
        row.forEach(cell => {
          const val = parseFloat(cell);
          if (!isNaN(val) && val >= 0 && val <= 100) {
            scores.push(val);
          }
        });
      });

      document.getElementById('statCount').textContent = totalStudents;

      if (scores.length > 0) {
        const sum = scores.reduce((acc, curr) => acc + curr, 0);
        const avg = (sum / scores.length).toFixed(1);
        const max = Math.max(...scores);
        const min = Math.min(...scores);

        document.getElementById('statAvg').textContent = avg;
        document.getElementById('statMax').textContent = max;
        document.getElementById('statMin').textContent = min;
        document.getElementById('statsSection').classList.remove('hidden');
      } else {
        document.getElementById('statsSection').classList.add('hidden');
      }
    }

    // 支援拖曳上傳互動
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('border-brand-500', 'bg-slate-50');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-brand-500', 'bg-slate-50');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        document.getElementById('fileInput').files = files;
        handleFileUpload({ target: { files: files } });
      }
    });
  </script>
</body>
</html>
