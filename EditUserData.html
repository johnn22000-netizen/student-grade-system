<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成員資料檢視與編修</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; color: #1e293b; padding: 24px; }
    h3 { font-size: 1.15rem; margin-bottom: 6px; }
    p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn { padding: 8px 16px; font-size: 0.9rem; font-weight: 500; border: none; border-radius: 6px; cursor: pointer; }
    .btn-success { background: #16a34a; color: white; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .data-table th, .data-table td { border: 1px solid #e2e8f0; padding: 10px 14px; text-align: left; }
    .data-table th { background-color: #f1f5f9; font-weight: 600; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 24px; border-radius: 8px; width: 100%; max-width: 450px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
  </style>
</head>
<body>
  <h3>成員資料檢視與編修 (EditUserData)</h3>
  <p class="subtitle">檢視現有班級成員清單，進行單筆資料新增、修改或刪除。</p>

  <div class="bar">
    <h4 style="font-size: 1rem;">現有成員名單</h4>
    <button class="btn btn-success" onclick="openModal()">＋ 單筆新增成員</button>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>座號</th>
        <th>學號</th>
        <th>姓名</th>
        <th>身分</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="user-tbody">
      <tr>
        <td>01</td>
        <td>11501</td>
        <td>王小明</td>
        <td>學生</td>
        <td>
          <button class="btn btn-primary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="openModal()">編輯</button>
          <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="alert('已刪除')">刪除</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div id="user-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;">成員資料編輯</h3>
      <div class="form-group"><label>座號</label><input type="number" id="m-seat"></div>
      <div class="form-group"><label>學號</label><input type="text" id="m-sid"></div>
      <div class="form-group"><label>姓名</label><input type="text" id="m-name"></div>
      <div class="form-group">
        <label>身分</label>
        <select id="m-role"><option>學生</option><option>家長</option></select>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
        <button class="btn" style="background: #e2e8f0;" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveUser()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    function openModal() { document.getElementById('user-modal').classList.add('active'); }
    function closeModal() { document.getElementById('user-modal').classList.remove('active'); }
    function saveUser() { alert('成員資料已儲存！'); closeModal(); }
  </script>
</body>
</html>
