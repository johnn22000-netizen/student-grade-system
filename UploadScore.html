<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成績記錄批次上傳</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; color: #1e293b; padding: 24px; }
    h3 { font-size: 1.15rem; margin-bottom: 6px; }
    p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .upload-card { border: 2px dashed #cbd5e1; padding: 30px; text-align: center; border-radius: 10px; background: #f8fafc; cursor: pointer; margin-bottom: 20px; }
    .btn { padding: 10px 20px; font-size: 0.9rem; font-weight: 500; border: none; border-radius: 6px; cursor: pointer; background: #16a34a; color: white; }
  </style>
</head>
<body>
  <h3>成績記錄批次上傳 (UploadScore)</h3>
  <p class="subtitle">輸入評量名稱並上傳成績檔案，系統將自動比對學號與座號寫入記錄。</p>

  <div class="form-group">
    <label>評量 / 作業名稱：</label>
    <input type="text" placeholder="例如：第一次期中考數學">
  </div>

  <div class="upload-card" onclick="document.getElementById('score-file').click()">
    <p style="font-weight: 500;">📊 點擊上傳成績資料檔案 (.csv / .xlsx)</p>
    <input type="file" id="score-file" style="display: none;" accept=".csv, .xlsx">
  </div>

  <button class="btn" onclick="alert('已送出成績批次上傳')">⚡ 開始匯入成績</button>
</body>
</html>
